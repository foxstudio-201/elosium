[package]
name = "elosium"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "3d",
    "ui",
    "bevy_post_process",
    "file_watcher",
    "bevy_camera_controller",
    "free_camera",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
